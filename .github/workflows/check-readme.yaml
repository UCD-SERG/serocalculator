# Workflow derived from https://github.com/IndrajeetPatil/statsExpressions/blob/1865ad02a6/.github/workflows/check-readme.yaml
# (pinned to the last commit whose content still matches what this file was
# derived from. Upstream reduced that file to a one-line delegator in #335 and
# deleted it outright in #336, both on 2026-04-03, so neither its default
# branch nor any later commit shows the standalone workflow any more.)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: check-readme

jobs:
  check-readme:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }
          #- { os: ubuntu-latest, r: "devel" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "latest"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: devel
          upgrade: "TRUE"
          extra-packages: |
            local::.
            any::qrcode

      - name: Render README
        run: |
          options(
            crayon.enabled = TRUE,
            # warnPartialMatchArgs = TRUE,
            # warnPartialMatchAttr = TRUE,
            # warnPartialMatchDollar = TRUE,
            warn = 2L
          )
          rmarkdown::render("README.Rmd")
        shell: Rscript {0}
