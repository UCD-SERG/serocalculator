---
name: Docs 📚

# Renders the altdoc/Quarto docs site and deploys multiple versions side by
# side on gh-pages:
#   - PRs                -> /pr-preview/pr-<number>/
#   - pushes to main     -> /dev/          (development docs)
#   - published releases -> /latest-tag/ and /vX.Y.Z/ (stable + archive)
# Root (/) is a redirect landing page into the default docs version.
#
# The implementation lives in Morrison-Lab/gha (UCD-SERG/serocalculator#595).
# This file only declares when to run and what to pass; the version-dropdown
# and landing-page scripts that used to sit in .github/scripts/ are now the
# generate-altdoc-version-dropdown and generate-altdoc-landing-page composite
# actions there.
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source =
# "Deploy from a branch", branch `gh-pages` / `(root)`.

on:
  push:
    branches:
      - main
    paths:
      - 'man/**'
      - 'altdoc/**'
      - 'vignettes/**'
      - 'macros/**'
      - '.gitmodules'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  release:
    types: [published]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - 'man/**'
      - 'altdoc/**'
      - 'vignettes/**'
      - 'macros/**'
      - '.gitmodules'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: Documentation version to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
      release_tag:
        description: Stable release tag to deploy when version=stable (for example, v1.4.1)
        required: false
        type: string

# No workflow-level `concurrency:` here. The reusable workflow sets its own
# job-level group (`altdoc-multiversion-docs-<run-id-or-ref>`). A caller-side
# group that resolves to the same string as a job-level one deadlocks: the run
# itself holds the group, so the job can never acquire it and is failed
# instantly with no logs. See UCD-SERG/serocalculator#590.

jobs:
  docs:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/altdoc-multiversion-docs.yml@v2
    with:
      # Pins the altdoc fork this package's docs build needs; the reusable
      # workflow's default is `any::altdoc`.
      r-packages: |
        d-morrison/altdoc
        quarto-dev/quarto-r
        any::sessioninfo
        local::.
      dispatch-version: ${{ github.event.inputs.version }}
      dispatch-release-tag: ${{ github.event.inputs.release_tag }}
      # Before the altdoc migration this site was built by pkgdown and
      # insightsengineering/r-pkgdown-multiversion, which published each branch
      # under its own name -- so the development docs lived at /main/. They now
      # live at /dev/. This generates a site-root 404.html redirecting
      # /main/<path> to /dev/<path>, deep links included, so links written
      # against the old layout keep resolving.
      legacy-paths: main=dev
