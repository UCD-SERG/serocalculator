---
name: Docs 📚

# Renders the altdoc/Quarto docs site and deploys multiple versions side by
# side on gh-pages:
#   - PRs                -> /pr-preview/pr-<number>/
#   - pushes to main     -> /dev/          (development docs)
#   - published releases -> /latest-tag/ and /vX.Y.Z/ (stable + archive)
# Root (/) is a redirect landing page into the default docs version.
#
# The implementation lives in Morrison-Lab/gha (UCD-SERG/serocalculator#595).
# This file only declares when to run and what to pass; the version-dropdown
# and landing-page scripts that used to sit in .github/scripts/ are now the
# generate-altdoc-version-dropdown and generate-altdoc-landing-page composite
# actions there.
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source =
# "Deploy from a branch", branch `gh-pages` / `(root)`.

on:
  push:
    branches:
      - main
    paths:
      - 'man/**'
      - 'altdoc/**'
      - 'vignettes/**'
      - 'macros/**'
      - '.gitmodules'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  release:
    types: [published]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - 'man/**'
      - 'altdoc/**'
      - 'vignettes/**'
      - 'macros/**'
      - '.gitmodules'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: Documentation version to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
      release_tag:
        description: Stable release tag to deploy when version=stable (for example, v1.4.1)
        required: false
        type: string

# No workflow-level `concurrency:` here. The reusable workflow sets its own
# job-level group (`altdoc-multiversion-docs-<run-id-or-ref>`). A caller-side
# group that resolves to the same string as a job-level one deadlocks: the run
# itself holds the group, so the job can never acquire it and is failed
# instantly with no logs. See UCD-SERG/serocalculator#590.

jobs:
  docs:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/altdoc-multiversion-docs.yml@v2
    with:
      # Pins the altdoc fork this package's docs build needs; the reusable
      # workflow's default is `any::altdoc`.
      r-packages: |
        d-morrison/altdoc
        quarto-dev/quarto-r
        any::sessioninfo
        local::.
      dispatch-version: ${{ github.event.inputs.version }}
      dispatch-release-tag: ${{ github.event.inputs.release_tag }}
      # Generates a site-root 404.html that rewrites a request whose first
      # path segment matches one of these keys, deep links included, so URLs
      # written against the pre-migration layout keep resolving
      # (UCD-SERG/serocalculator#681).
      #
      # Every target is /latest-tag/ rather than /dev/, for two reasons.
      #
      # First, /latest-tag/ is still the pkgdown-shaped v1.4.1 build, so it is
      # the only target that preserves a pre-migration path tail verbatim:
      # /reference/index.html and /articles/<name>.html both resolve there and
      # neither exists under /dev/, which altdoc publishes as reference.html,
      # man/<topic>.html and vignettes/<path>.html instead. That is also why
      # the old `main=dev` mapping had silently stopped working for deep
      # links: /main/reference/index.html was being sent to a 404.
      #
      # Second, an unversioned link is overwhelmingly a citation or a search
      # result, whose reader wants the released docs rather than unreleased
      # behaviour they do not have installed.
      #
      # No entry may name a segment that exists under /latest-tag/, or the
      # redirect would loop; `latest-tag` itself is deliberately absent.
      legacy-paths: |
        main=latest-tag
        reference=latest-tag/reference
        articles=latest-tag/articles
        news=latest-tag/news
