---
name: Docs 📚

# Renders the altdoc/Quarto docs site and deploys multiple versions side by
# side on gh-pages:
#   - PRs                -> /pr-preview/pr-<number>/
#   - pushes to main     -> /dev/          (development docs)
#   - published releases -> /latest-tag/ and /vX.Y.Z/ (stable + archive)
# Root (/) is a redirect landing page into the default docs version.
#
# The implementation lives in Morrison-Lab/gha (UCD-SERG/serocalculator#595).
# This file only declares when to run and what to pass; the version-dropdown
# and landing-page scripts that used to sit in .github/scripts/ are now the
# generate-altdoc-version-dropdown and generate-altdoc-landing-page composite
# actions there.
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source =
# "Deploy from a branch", branch `gh-pages` / `(root)`.

on:
  push:
    branches:
      - main
    paths:
      - 'man/**'
      - 'altdoc/**'
      - 'vignettes/**'
      - 'macros/**'
      - '.gitmodules'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  release:
    types: [published]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - 'man/**'
      - 'altdoc/**'
      - 'vignettes/**'
      - 'macros/**'
      - '.gitmodules'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: Documentation version to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
      release_tag:
        description: Stable release tag to deploy when version=stable (for example, v1.4.1)
        required: false
        type: string

# No workflow-level `concurrency:` here. The reusable workflow sets its own
# job-level group (`altdoc-multiversion-docs-<run-id-or-ref>`). A caller-side
# group that resolves to the same string as a job-level one deadlocks: the run
# itself holds the group, so the job can never acquire it and is failed
# instantly with no logs. See UCD-SERG/serocalculator#590.

jobs:
  docs:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/altdoc-multiversion-docs.yml@v2
    with:
      # Pins the altdoc fork this package's docs build needs; the reusable
      # workflow's default is `any::altdoc`.
      r-packages: |
        d-morrison/altdoc
        quarto-dev/quarto-r
        any::sessioninfo
        local::.
      dispatch-version: ${{ github.event.inputs.version }}
      dispatch-release-tag: ${{ github.event.inputs.release_tag }}
      # Point the site root at the released docs rather than at whatever the
      # last deploy happened to build (UCD-SERG/serocalculator#681).
      #
      # Without this, a push to main repoints `/` at `/dev/`, so a reader
      # arriving from CRAN, from a citation, or from a search result lands on
      # documentation for unreleased behaviour they do not have installed --
      # and pushes to main are far more frequent than releases, so that is
      # where the root sits almost all the time.
      #
      # `latest-tag` rather than a pinned `vX.Y.Z` on purpose, and the
      # opposite choice from `legacy-paths` below. The root only needs to
      # land the reader on the current release, so it should track releases.
      # The redirects below need the pkgdown PATH SHAPE preserved, which only
      # a frozen archive keeps -- see MULTI_VERSION_DOCS.md.
      #
      # Requires Morrison-Lab/gha@v2 at eb526d7 or later (gha#847). Passing an
      # input the pinned tag does not declare fails the call outright, so this
      # line and the `@v2` pin above move together.
      root-landing-target: latest-tag
      # Generates a site-root 404.html that rewrites a request whose first
      # path segment matches one of these keys, deep links included, so URLs
      # written against the pre-migration layout keep resolving
      # (UCD-SERG/serocalculator#681).
      #
      # Every target is under /v1.4.1/, and the choice of *that* version over
      # /latest-tag/ is the load-bearing part.
      #
      # A pre-migration URL is pkgdown-shaped: /reference/index.html,
      # /articles/<name>.html. The 404 page rewrites only the FIRST path
      # segment, so it cannot reshape the tail -- which means the target has
      # to be a pkgdown-shaped build or the redirect lands on a 404. /dev/ is
      # altdoc-shaped already (reference.html, man/<topic>.html,
      # vignettes/<path>.html), so it was never a candidate.
      #
      # /latest-tag/ is pkgdown-shaped only because it still holds the v1.4.1
      # build. This workflow rebuilds /latest-tag/ with altdoc on every
      # published release, so the first release after this merges would
      # silently turn all three of these into 404s. /vX.Y.Z/ directories are
      # archived and never rebuilt, so v1.4.1 stays pkgdown-shaped for good.
      # That is also the version those links were written against.
      #
      # Measured 2026-09-08, with /dev/ standing in for what /latest-tag/
      # becomes at the next release:
      #
      #   path                   /latest-tag/   /v1.4.1/   /dev/
      #   reference/index.html   200            200        404
      #   reference.html         404            --         200
      #
      # Bump this to a later /vX.Y.Z/ only if that release was itself built
      # by pkgdown; every altdoc-built release fails for the shape reason
      # above, not the freshness one.
      #
      # The loop rule is about targets, not about what exists: no KEY here may
      # be the FIRST SEGMENT of any TARGET, since that is all the rewrite
      # matches on. `v1.4.1` is absent from the key column for exactly that
      # reason. It is fine for a key to name a directory that also exists
      # under /v1.4.1/ -- `reference`, `articles` and `news` all do, and none
      # of them loops, because the rewritten URL's first segment is `v1.4.1`.
      legacy-paths: |
        main=v1.4.1
        reference=v1.4.1/reference
        articles=v1.4.1/articles
        news=v1.4.1/news
