# Grouping for the documentation website's reference manual.
#
# altdoc reads this once and builds two things from it: the reference index
# page (`reference.md`, linked as "Reference" in the navbar) and the sidebar's
# Reference section. Those two used to be maintained separately -- a
# hand-written `reference.qmd` and a hand-written `Reference` block in
# `quarto_website.yml` -- with nothing keeping them in step, so a topic added
# to one and missed in the other rendered cleanly and went unnoticed. Declaring
# the grouping once here is what makes that impossible rather than merely
# checkable.
#
# Each topic's one-line summary on the index page is its `.Rd` `\title{}`, so
# summaries are never restated here. Only the grouping is.
#
# `render_docs()` warns about any non-internal topic no section below claims
# and drops it into a trailing "Other" section, so a newly exported function
# shows up as a warning rather than silently going unlisted. Topics marked
# `@keywords internal` are excluded from both surfaces and do not belong here.

title: Package index

# The sidebar used to show each topic's title alone, which left `as_pop_data`
# and `load_pop_data` as two adjacent entries reading "Load a cross-sectional
# antibody survey data set" with nothing to tell them apart -- and the same for
# the `as_noise_params`/`load_noise_params` pair below it. Prefixing the name
# separates them.
sidebar_labels: name-and-title

# The reference sidebar is long enough that it crowds the content, so this site
# starts it folded and lets the reader open it. altdoc's own default is
# `expanded`, so omitting this would silently start the sidebar open -- the
# behavior would revert rather than fail, which is why it is set explicitly
# rather than left to the default.
sidebar_fold: collapsed

