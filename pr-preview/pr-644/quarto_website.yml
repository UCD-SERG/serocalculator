project:
  type: website
  output-dir: ../docs/
  render:
    - "*.qmd" # Render all Quarto markdown files
    - "*.Rmd" # Also render R markdown files
    - "*.md" # Also render plain markdown files
    - "!README.md" # Except README which is used in index
    - "!index.md" # Except index which is replaced by index.qmd
    - "!vignettes/articles/_*.qmd" # Exclude include-only files (prefixed with _)
# Enable freeze to cache expensive computations and speed up builds
# This is especially important for vignettes with long-running code
execute:
  freeze: auto # re-execute only when source changes
  message: false
bibliography: vignettes/references.bib
website:
  title: "$ALTDOC_PACKAGE_NAME"
  repo-url: https://github.com/UCD-SERG/serocalculator
  repo-actions: [edit, source, issue]
  navbar:
    title: "$ALTDOC_PACKAGE_NAME <small class='navbar-version text-danger' title='Development version'>1.4.1.9033</small>"
    search: true
    pinned: false
    right:
      # Generated by generate-altdoc-version-dropdown (Morrison-Lab/gha); edits here are overwritten on every docs build.
      - text: "1.4.1.9033 (dev)"
        menu:
          - text: "v1.4.1 (stable)"
            href: https://UCD-SERG.github.io/serocalculator/latest-tag/
          - text: "1.4.1.9033 (dev)"
            href: https://UCD-SERG.github.io/serocalculator/dev/
          - text: "---"
          - text: "v1.4.0"
            href: https://UCD-SERG.github.io/serocalculator/v1.4.0/
          - text: "v1.3.0"
            href: https://UCD-SERG.github.io/serocalculator/v1.3.0/
      - icon: github
        href: https://github.com/UCD-SERG/serocalculator/pull/644
        aria-label: View $ALTDOC_PACKAGE_NAME on GitHub
    left:
      - text: Reference
        file: $ALTDOC_REFERENCE
      - text: Get started
        file: vignettes/articles/serocalculator.Rmd
      - text: Articles
        menu:
          - text: "---Methodology---"
          - text: "Methodology"
            file: vignettes/methodology.qmd
          - text: "Simulate cross-sectional data"
            file: vignettes/articles/simulate_xsectionalData.qmd
          - text: "---Examples---"
          - text: "Enteric fever example"
            file: vignettes/articles/enteric_fever_example.Rmd
          - text: "Scrub typhus example"
            file: vignettes/articles/scrubTyphus_example.Rmd
          - text: "---Other---"
          - text: "Version crosswalk (1.3 to 1.4)"
            file: vignettes/articles/version-crosswalk-1.3-to-1.4.qmd
      - text: Changelog
        file: NEWS.md
      - text: More
        menu:
          - text: "---Links---"
          - text: "View on CRAN"
            href: https://CRAN.R-project.org/package=serocalculator
          - text: "Browse source code"
            href: $ALTDOC_PACKAGE_URL_GITHUB
          - text: "Report a bug"
            href: https://github.com/UCD-SERG/serocalculator/issues
          - text: "---License---"
          - text: "GPL-3"
            href: https://www.gnu.org/licenses/gpl-3.0.html
          - text: "---Community---"
          - text: "Contributing guide"
            file: CONTRIBUTING.md
          - text: "Code of conduct"
            file: CODE_OF_CONDUCT.md
          - text: "---Citation---"
          - text: "Citing serocalculator"
            file: citation.qmd
  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        file: index.qmd
      - section: Articles
        contents:
          - section: Get started
            contents:
              - vignettes/articles/serocalculator.Rmd
          - section: Methodology
            contents:
              - vignettes/methodology.qmd
              - vignettes/articles/simulate_xsectionalData.qmd
          - section: Examples
            contents:
              - vignettes/articles/enteric_fever_example.Rmd
              - vignettes/articles/scrubTyphus_example.Rmd
          - section: Other
            contents:
              - vignettes/articles/version-crosswalk-1.3-to-1.4.qmd
      # Expanded by altdoc into the sections declared in altdoc/reference.yml,
      # the same ones that group the reference index page.
      - text: Package index
        file: $ALTDOC_REFERENCE
      - section: $ALTDOC_MAN_BLOCK
      - text: News
        file: NEWS.md
      - text: Code of conduct
        file: CODE_OF_CONDUCT.md
      - text: Contributing
        file: CONTRIBUTING.md
      - text: Citation
        file: citation.qmd
  repo-branch: copilot/update-deprecated-xfun-functions
format:
  html:
    # Click any figure to open a zoomed lightbox view. `lightbox: true` covers
    # every block image (both `#fig-`-labelled figures and plain `![](...)`
    # images), so no per-figure `.lightbox` class or `match: auto` is needed.
    #
    # This MUST be nested under `format: html:`, not set as a top-level
    # (document) option. altdoc's `.finalize_quarto_website()` filters the
    # generated `_quarto.yml` with `settings[!grepl("^\\w*$", settings)]`,
    # which drops any top-level key whose value stringifies to all word
    # characters -- and a top-level `lightbox: true` becomes "TRUE", so it is
    # silently removed and never reaches the built site (verified: the
    # pr-preview build had zero lightbox markup with the top-level form).
    # Nested inside the `format` list it is untouched by that filter.
    #
    # This covers every HTML page. The reveal.js slides
    # (methodology-slides.html) are a separate format and are handled by a
    # `lightbox: true` in vignettes/methodology.qmd's own frontmatter.
    lightbox: true
    code-link: true # enables downlit; see https://altdoc.etiennebacher.com/#/man/render_docs.md#auto-link-for-quarto-websites
    theme:
      light: default
      dark: darkly
    css: styles.css
    # Adds the navbar control that folds the sidebar away. altdoc ships the
    # snippet and stages it into `_quarto/` at render time, style and script
    # together, so there is nothing to keep in step here and fixes to it arrive
    # by upgrading altdoc. The sidebar starts folded, which is not the default;
    # `sidebar_fold: collapsed` in `altdoc/reference.yml` is what chooses that.
    include-in-header: $ALTDOC_SIDEBAR_FOLD
    number-sections: false
    code-fold: show
    echo: true
    code-copy: true
    code-overflow: scroll
    title-block-style: none
    toc: true
    grid:
      sidebar-width: 340px
      margin-width: 340px
# Quarto extensions ported from Morrison-Lab/rpt (the lab's R-package
# template). Extensions live in altdoc/_extensions/ (not vignettes/_extensions/)
# because altdoc.finalize_quarto_website() stages this altdoc/ directory as
# the project root of the `_quarto/` build tree it hands to Quarto -- an
# extension has to sit there, not under vignettes/, for a project-level
# `filters:` entry (below) to resolve it.
filters:
  - slidebreak
  - d-morrison/div-anchors
  - d-morrison/equation-anchors
  - sun123zxy/callouty-theorem
  - coatless-quarto/custom-callout
  # Declaring `revealjs:` as a project-level format (instead of registering
  # this filter here) would apply RevealJS as a format to every rendered
  # page -- including index.qmd, man pages, and NEWS.md -- breaking the docs
  # build, since Quarto would then try to produce both an .html and a
  # RevealJS output at the same output path for pages with no dedicated
  # `output-file:`. The filter itself already guards on
  # `string.match(FORMAT, "revealjs")` and returns immediately for every
  # other format, so it's safe in the global chain and only activates for
  # vignettes/methodology.qmd, which already opts into `format: revealjs:`
  # in its own front matter.
  - d-morrison/revealjs-html-links
  - quarto
callouty-theorem:
  # override-title: true for every type below (an improvement over qwt/rme's
  # upstream config, which leaves it false for thm/lem/cor/prp/cnj/def/exm/exr):
  # with override-title: false, Quarto's default callout title falls back to
  # the raw `type:` code (e.g. a rendered callout literally titled "Exm"
  # instead of "Example"). override-title: true renders the theorem-family
  # English label plus the div's heading text, e.g. "Example (A first
  # example)". Note this still doesn't produce Quarto's native crossref
  # numbering ("Example 3.2") -- wrapping the theorem in a generic callout
  # (quarto.Callout) instead of rendering it as a native Theorem node loses
  # that; a real numbered label would require deeper changes to the
  # callouty-theorem extension itself.
  thm:
    override-title: true # override the callout title with
    # the theorem-type label,
    # appending the element name when provided
    callout: # parameters of the wrapping callout
      # see Quarto callout docs for details
      type: lem # same color as lem (royal blue); color set in custom-callout block below
      appearance: minimal
  lem:
    override-title: true
    callout:
      type: lem
      appearance: minimal
  cor:
    override-title: true
    callout:
      type: cor
      appearance: minimal
  prp:
    override-title: true
    callout:
      type: prp
      appearance: minimal
  cnj:
    override-title: true
    callout:
      type: cnj
      appearance: minimal
  def:
    override-title: true
    callout:
      type: def
      appearance: minimal
  exm:
    override-title: true
    callout:
      type: exm
      appearance: default
      collapse: false
      icon: false
  exr:
    override-title: true
    callout:
      type: exr
      appearance: minimal
  proof: # also support wrapping proof-like environments
    override-title: true # override the callout title with
    # the proof-type label,
    # appending the element name when provided
    callout:
      type: proof
      appearance: default
      collapse: true
      icon: true
  solution:
    override-title: true
    callout:
      type: solution
      appearance: default
      collapse: true
      icon: false
  remark:
    override-title: true
    callout:
      type: remark
      appearance: default
      collapse: false
      icon: true
# Color palette for theorem/proof environments.
# The coatless-quarto/custom-callout extension reads this block and injects
# CSS (HTML) and LaTeX \definecolor (PDF) so each type gets a unique color.
# Rules: no reds; thm shares lem's royal blue.
custom-callout:
  lem:
    color: "#1565C0" # royal blue (also used for thm)
  cor:
    color: "#00838F" # dark cyan
  prp:
    color: "#827717" # dark olive
  cnj:
    color: "#558B2F" # grass green
  def:
    color: "#1B5E20" # forest green (very distinct from theorem types)
  exm:
    color: "#6A1B9A" # deep purple
  exr:
    color: "#FFA500" # orange
  proof:
    color: "#37474F" # blue-grey slate
  solution:
    color: "#4E342E" # dark cocoa
  remark:
    color: "#AD1457" # dark magenta
